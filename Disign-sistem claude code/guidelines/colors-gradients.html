<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;min-height:100vh}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.chip{height:64px;border-radius:var(--r-sm);border:1px solid var(--g-border)}.n{font-family:var(--f-display);font-weight:700;font-size:13px;margin-top:8px;color:var(--text)}.v{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}.lbl{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--heading-gradient)"></div><div class="n">--heading-gradient</div><div class="v">125deg white→periwinkle→lilac→mint</div></div><div class="sw"><div class="chip" style="background:var(--cta-gradient)"></div><div class="n">--cta-gradient</div><div class="v">135deg #63d059 → #84cc16</div></div><div class="sw"><div class="chip" style="background:var(--page-bg)"></div><div class="n">--page-bg</div><div class="v">#08080e + faint radial tints</div></div></div></body></html>
