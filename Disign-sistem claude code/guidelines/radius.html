<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;min-height:100vh}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.chip{height:64px;border-radius:var(--r-sm);border:1px solid var(--g-border)}.n{font-family:var(--f-display);font-weight:700;font-size:13px;margin-top:8px;color:var(--text)}.v{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}.lbl{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase}</style></head><body><div class="row"><div class="sw"><div style="height:64px;background:var(--g-2);border:1px solid var(--g-border-strong);border-radius:var(--r-xs)"></div><div class="n">--r-xs · 4px</div><div class="v">—</div></div><div class="sw"><div style="height:64px;background:var(--g-2);border:1px solid var(--g-border-strong);border-radius:var(--r-sm)"></div><div class="n">--r-sm · 8px</div><div class="v">inline code</div></div><div class="sw"><div style="height:64px;background:var(--g-2);border:1px solid var(--g-border-strong);border-radius:var(--r-md)"></div><div class="n">--r-md · 14px</div><div class="v">buttons, blockquote</div></div><div class="sw"><div style="height:64px;background:var(--g-2);border:1px solid var(--g-border-strong);border-radius:var(--r-lg)"></div><div class="n">--r-lg · 22px</div><div class="v">cards, prose</div></div><div class="sw"><div style="height:64px;background:var(--g-2);border:1px solid var(--g-border-strong);border-radius:var(--r-full)"></div><div class="n">--r-full · 999px</div><div class="v">theme toggle</div></div></div></body></html>
