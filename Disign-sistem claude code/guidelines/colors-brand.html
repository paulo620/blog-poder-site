<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;min-height:100vh}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.chip{height:64px;border-radius:var(--r-sm);border:1px solid var(--g-border)}.n{font-family:var(--f-display);font-weight:700;font-size:13px;margin-top:8px;color:var(--text)}.v{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}.lbl{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--c-teal)"></div><div class="n">Teal</div><div class="v">--c-teal · #00e5cc</div></div><div class="sw"><div class="chip" style="background:var(--c-purple)"></div><div class="n">Purple</div><div class="v">--c-purple · #af6dff</div></div><div class="sw"><div class="chip" style="background:var(--c-green)"></div><div class="n">Green</div><div class="v">--c-green · #63d059</div></div><div class="sw"><div class="chip" style="background:var(--c-green-cta)"></div><div class="n">Green CTA</div><div class="v">--c-green-cta · #84cc16</div></div><div class="sw"><div class="chip" style="background:var(--c-blue)"></div><div class="n">Blue</div><div class="v">--c-blue · #0058d4</div></div><div class="sw"><div class="chip" style="background:var(--c-blue-light)"></div><div class="n">Blue light</div><div class="v">--c-blue-light · #5b9bff</div></div></div></body></html>
