<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;min-height:100vh}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.chip{height:64px;border-radius:var(--r-sm);border:1px solid var(--g-border)}.n{font-family:var(--f-display);font-weight:700;font-size:13px;margin-top:8px;color:var(--text)}.v{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}.lbl{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase}</style></head><body><div style="position:relative;height:200px;border-radius:var(--r-lg);overflow:hidden;background:var(--page-bg)"><div style="position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:64px 64px"></div><div style="position:absolute;width:220px;height:220px;left:40px;top:10px;border-radius:50%;filter:blur(60px);background:radial-gradient(circle,rgba(0,204,177,.4),transparent 70%)"></div><div style="position:absolute;width:260px;height:260px;left:300px;top:-40px;border-radius:50%;filter:blur(60px);background:radial-gradient(circle,rgba(123,97,255,.35),transparent 70%)"></div><div style="position:absolute;width:200px;height:200px;left:420px;top:80px;border-radius:50%;filter:blur(60px);background:radial-gradient(circle,rgba(255,73,219,.3),transparent 70%)"></div><div style="position:absolute;width:180px;height:180px;left:150px;top:110px;border-radius:50%;filter:blur(60px);background:radial-gradient(circle,rgba(28,160,251,.35),transparent 70%)"></div></div></body></html>
