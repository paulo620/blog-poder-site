<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;min-height:100vh}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.chip{height:64px;border-radius:var(--r-sm);border:1px solid var(--g-border)}.n{font-family:var(--f-display);font-weight:700;font-size:13px;margin-top:8px;color:var(--text)}.v{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}.lbl{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase}</style></head><body><div data-theme="light" style="background:var(--bg-body);padding:16px;border-radius:var(--r-md)"><div class="row"><div class="sw"><div class="chip" style="background:var(--bg)"></div><div class="n">BG</div><div class="v">--bg · #fbf9f4</div></div><div class="sw"><div class="chip" style="background:var(--bg-2)"></div><div class="n">BG 2</div><div class="v">--bg-2 · #f3efe8</div></div><div class="sw"><div class="chip" style="background:var(--surface-2)"></div><div class="n">Surface 2</div><div class="v">--surface-2 · #ece9e3</div></div><div class="sw"><div class="chip" style="background:var(--text)"></div><div class="n">Text</div><div class="v">--text · #1c1c1c</div></div><div class="sw"><div class="chip" style="background:var(--c-teal-fg)"></div><div class="n">Teal fg</div><div class="v">--c-teal-fg · #00897b</div></div><div class="sw"><div class="chip" style="background:var(--c-purple-fg)"></div><div class="n">Purple fg</div><div class="v">--c-purple-fg · #6d28d9</div></div></div></div></body></html>
