<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;min-height:100vh}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.chip{height:64px;border-radius:var(--r-sm);border:1px solid var(--g-border)}.n{font-family:var(--f-display);font-weight:700;font-size:13px;margin-top:8px;color:var(--text)}.v{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}.lbl{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase}</style></head><body><div style="position:relative;padding:20px;border-radius:var(--r-lg);background:radial-gradient(circle at 20% 30%,rgba(0,204,177,.4),transparent 60%),radial-gradient(circle at 80% 60%,rgba(123,97,255,.35),transparent 60%),#08080e"><div class="row"><div class="sw" style="height:90px;border-radius:var(--r-md);background:var(--g-1);border:1px solid var(--g-border);backdrop-filter:var(--g-blur);padding:12px"><div class="n" style="margin:0">--g-1</div><div class="v">#ffffff0e</div></div><div class="sw" style="height:90px;border-radius:var(--r-md);background:var(--g-2);border:1px solid var(--g-border);backdrop-filter:var(--g-blur);padding:12px"><div class="n" style="margin:0">--g-2</div><div class="v">#ffffff16</div></div><div class="sw" style="height:90px;border-radius:var(--r-md);background:var(--g-3);border:1px solid var(--g-border);backdrop-filter:var(--g-blur);padding:12px"><div class="n" style="margin:0">--g-3</div><div class="v">#ffffff20</div></div><div class="sw" style="height:90px;border-radius:var(--r-md);border:1px solid var(--g-border-strong);padding:12px"><div class="n" style="margin:0">--g-border-strong</div><div class="v">#ffffff47 (hover)</div></div></div></div></body></html>
