<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;min-height:100vh}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.chip{height:64px;border-radius:var(--r-sm);border:1px solid var(--g-border)}.n{font-family:var(--f-display);font-weight:700;font-size:13px;margin-top:8px;color:var(--text)}.v{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}.lbl{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--c-teal-bright)"></div><div class="n">Teal bright</div><div class="v">--c-teal-bright · #5fffda</div></div><div class="sw"><div class="chip" style="background:var(--c-purple-light)"></div><div class="n">Purple light</div><div class="v">--c-purple-light · #8e4fd6</div></div><div class="sw"><div class="chip" style="background:var(--c-green-bright)"></div><div class="n">Green bright</div><div class="v">--c-green-bright · #b5ff2b</div></div><div class="sw"><div class="chip" style="background:var(--c-yellow)"></div><div class="n">Yellow</div><div class="v">--c-yellow · #ffb801</div></div><div class="sw"><div class="chip" style="background:var(--c-yellow-em)"></div><div class="n">Yellow em</div><div class="v">--c-yellow-em · #facc15</div></div><div class="sw"><div class="chip" style="background:var(--c-red)"></div><div class="n">Red</div><div class="v">--c-red · #f84f2e</div></div></div></body></html>
