<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;min-height:100vh}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.chip{height:64px;border-radius:var(--r-sm);border:1px solid var(--g-border)}.n{font-family:var(--f-display);font-weight:700;font-size:13px;margin-top:8px;color:var(--text)}.v{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}.lbl{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase}</style></head><body><div class="row"><div class="sw" style="padding:14px;background:var(--g-2);border:1px solid var(--g-border);border-radius:var(--r-md)"><div class="n" style="margin:0">--t-fast</div><div class="v">.2s ease</div><div class="v" style="color:var(--text-2);margin-top:6px">buttons, links, nav color</div></div><div class="sw" style="padding:14px;background:var(--g-2);border:1px solid var(--g-border);border-radius:var(--r-md)"><div class="n" style="margin:0">--t-slow</div><div class="v">.38s cubic-bezier(.4,0,.2,1)</div><div class="v" style="color:var(--text-2);margin-top:6px">card lift -5px, image scale 1.04</div></div><div class="sw" style="padding:14px;background:var(--g-2);border:1px solid var(--g-border);border-radius:var(--r-md)"><div class="n" style="margin:0">--ease-out-expo</div><div class="v">cubic-bezier(.16,1,.3,1)</div><div class="v" style="color:var(--text-2);margin-top:6px">aurora card bloom/lift</div></div></div></body></html>
