<!doctype html><html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog ibe.IA — UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{display:flex;flex-direction:column;min-height:100vh}#root{flex:1;display:flex;flex-direction:column}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="BlogScreen.jsx"></script>
<script type="text/babel" src="ArticleScreen.jsx"></script>
<script type="text/babel">
const { SiteHeader, SiteFooter, ThemeToggle, AuroraBackground } = window.IbeIABlogDesignSystem_8b7900;
function App() {
  const [route, setRoute] = React.useState(() => JSON.parse(localStorage.getItem('ibe-kit-route') || '{"page":"Home"}'));
  const [theme, setTheme] = React.useState('dark');
  React.useEffect(() => { localStorage.setItem('ibe-kit-route', JSON.stringify(route)); window.scrollTo(0, 0); }, [route]);
  React.useEffect(() => { document.documentElement.dataset.theme = theme; }, [theme]);
  const go = (page) => setRoute({ page });
  const openPost = (p) => setRoute({ page: 'Post', slug: p.slug.replace(/-b$/, '') });
  const post = window.IBE_POSTS.find((p) => p.slug === route.slug) || window.IBE_POSTS[0];
  const active = route.page === 'Post' ? 'Blog' : route.page;
  return (
    <>
      {theme === 'dark' && <AuroraBackground />}
      <ThemeToggle fixed value={theme} onChange={setTheme} />
      <SiteHeader active={active} onNavigate={(l) => go(l.label === 'Sobre' ? 'Home' : l.label)} />
      <div style={{ flex: 1 }}>
        {route.page === 'Home' && <HomeScreen go={go} openPost={openPost} />}
        {route.page === 'Blog' && <BlogScreen openPost={openPost} />}
        {route.page === 'Post' && <ArticleScreen post={post} go={go} openPost={openPost} />}
      </div>
      <SiteFooter onNavigate={(l) => go(l.label === 'Blog' ? 'Blog' : 'Home')} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
